name: SkillNova CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality-gate:
    name: Lint, Typecheck & Database Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

  unit-and-integration-tests:
    name: Automated Unit & Integration Tests (Dedicated Test DB)
    runs-on: ubuntu-latest
    needs: quality-gate
    env:
      DATABASE_URL: "file:./test.db"
      AUTH_SECRET: "skillnova-ci-test-secret-key-32-chars-long!"
      NEXTAUTH_SECRET: "skillnova-ci-test-secret-key-32-chars-long!"
      NODE_ENV: "test"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Vitest Test Suite (Unit & Integration)
        run: npx vitest run

  production-build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    env:
      DATABASE_URL: "file:./dev.db"
      AUTH_SECRET: "skillnova-production-build-placeholder-secret!"
      NEXTAUTH_SECRET: "skillnova-production-build-placeholder-secret!"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Application
        run: npm run build
