services:
  skillnova-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillnova-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
      - AUTH_SECRET=replace-with-a-secure-32-character-secret-in-production
      - NEXTAUTH_SECRET=replace-with-a-secure-32-character-secret-in-production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - skillnova_data:/app/prisma

volumes:
  skillnova_data:
    driver: local
